[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/clojurecraft-app"]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
clojurecraft-hardware = { path = "crates/clojurecraft-hardware" }
clojurecraft-runtime = { path = "crates/clojurecraft-runtime" }
clojurecraft-inference = { path = "crates/clojurecraft-inference" }
clojurecraft-sandbox = { path = "crates/clojurecraft-sandbox" }
clojurecraft-clojure = { path = "crates/clojurecraft-clojure" }
clojurecraft-credentials = { path = "crates/clojurecraft-credentials" }
clojurecraft-domain = { path = "crates/clojurecraft-domain" }
clojurecraft-edn = { path = "crates/clojurecraft-edn" }
clojurecraft-store = { path = "crates/clojurecraft-store" }
clojurecraft-knowledge = { path = "crates/clojurecraft-knowledge" }
clojurecraft-workflow = { path = "crates/clojurecraft-workflow" }
clojurecraft-mcp = { path = "crates/clojurecraft-mcp" }

anyhow = "1"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard", "wayland", "x11", "persistence"] }
egui = "0.37"
flate2 = "1"
hex = "0.4"
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "3.2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.29", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
