# Clojure documentation ClojureCraft downloads and indexes for local retrieval.
#
# API entries come from the metadata of the installed, pinned Clojure runtime, so they always
# describe exactly that version. Reference and guide pages come from the clojure.org source
# repository, pinned to one commit; every page is pinned by size and SHA-256 and rejected if it
# differs. Changing anything here is an application release change and makes installed
# collections offer an update.

schema_version = 1
# Identifies this selection of sources and the way they are chunked.
revision = "2026.11.1"

[api]
name = "Clojure API reference"
# {ns} and {name} are replaced by the namespace and the var name.
url_template = "https://clojure.github.io/clojure/{ns}-api.html#{ns}/{name}"
special_form_url = "https://clojure.org/reference/special_forms"
license = "EPL-1.0"
attribution = "Docstrings from the Clojure source code. Copyright (c) Rich Hickey. Eclipse Public License 1.0."

[site]
name = "clojure.org reference and guides"
repository = "clojure/clojure-site"
commit = "d664fff7d2967bbb74157082796d28e1731d1d35"
license = "EPL-1.0"
attribution = "clojure.org content. Copyright (c) Rich Hickey and contributors. Eclipse Public License 1.0."

