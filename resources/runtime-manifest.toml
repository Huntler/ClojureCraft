# Third-party runtime components ClojureCraft downloads on first start.
#
# Every artifact is pinned by URL, size, and SHA-256. The installer refuses anything that does not
# match, so changing a version here is a deliberate application release change.

schema_version = 1

[llama_cpp]
release = "b12138"
commit = "f7b41cca4fecc8164c7ea45bfb55dfff7633842f"
homepage = "https://github.com/ggml-org/llama.cpp"
license = "MIT"
# Path of the server binary inside the extracted archive.
server_path = "llama-b12138/llama-server"

[[llama_cpp.assets]]
platform = "macos-aarch64"
backend = "metal"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b12138/llama-b12138-bin-macos-arm64.tar.gz"
size = 16670361
sha256 = "ef898f71f6f5d773565b84670eb0e6b9acf24a64d4c045e2e99fa24a9c9f7e8c"

